aid: freshehr
name: freshEHR
description: >-
  freshEHR Clinical Informatics Ltd is a UK open-standards health and social care
  informatics consultancy, founded in 2014 by Dr Ian McNicoll and registered in
  England as company 08989238. It provides openEHR and HL7 FHIR expertise rather
  than a software product: openEHR strategy, analysis, design and governance of
  clinical models (archetypes and templates), curation, terminology and data
  mapping across SNOMED CT, dm+d and ICD, data exchange work across HL7 V2, HL7
  CDA and HL7 FHIR, plus specialist training and mentoring in clinical modelling.
  Its work spans NHS England, NHS Education for Scotland, Digital Health and Care
  Wales, HSE Ireland, One London, CatSalut in Catalonia, the Jamaican Ministry of
  Health and Wellness, and Karolinska University Hospital. freshEHR operates no
  API of its own — no developer portal, no public API reference, and no
  machine-readable contract on any host it controls, verified 2026-09-02.
