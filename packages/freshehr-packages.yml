note: >-
  freshEHR Clinical Informatics is an openEHR/HL7 FHIR consultancy, not an API
  platform vendor. It publishes no client SDK, because it operates no API of its
  own. The packages below are open tooling its people publish for working with
  the openEHR REST API and with third-party openEHR platforms (Better/Ehrscape,
  Archetype Designer). They are deliberately NOT wired as `type: SDKs`: an SDK
  pointer asserts a client library for the provider's own API, and freshEHR has
  none.
